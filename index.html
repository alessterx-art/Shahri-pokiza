<!doctype html>
<html lang="tg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Шаҳри Покиза — Низоми идоракунии партовҳои шаҳрӣ</title>
    <meta name="description" content="Низоми ҳушманди назорати тозагӣ ва партовҳо дар Тоҷикистон бо ёрии зеҳни сунъӣ ва камераҳои назоратӣ" />
    <meta property="og:title" content="Шаҳри Покиза — Низоми идоракунии партовҳои шаҳрӣ" />
    <meta property="og:description" content="Низоми ҳушманди назорати тозагӣ ва партовҳо дар Тоҷикистон бо ёрии зеҳни сунъӣ ва камераҳои назоратӣ" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="text/javascript">
      // 1. Ensure trailing slash for repository subpath on GitHub Pages
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          var path = window.location.pathname;
          var segments = path.split('/').filter(Boolean);
          if (segments.length === 1 && !path.endsWith('/')) {
            window.location.replace(path + '/' + window.location.search + window.location.hash);
          }
        }
      })();

      // 2. GitHub Pages SPA router decoder for deep links
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-[#0c1512] text-slate-100 antialiased" style="background-color: #0c1512; color: #f1f5f9; margin: 0; min-height: 100vh;">
    <div id="root">
      <div id="pre-hydration-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0c1512; color: #10b981; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 50px; height: 50px; border: 3px solid #1e3a30; border-top-color: #10b981; border-radius: 50%; animation: shahriSpin 0.8s linear infinite;"></div>
        <p style="margin-top: 20px; font-size: 16px; font-weight: 700; color: #f1f5f9; letter-spacing: 0.3px;">Шаҳри Покиза</p>
        <p id="loader-status-text" style="margin-top: 6px; font-size: 13px; color: #94a3b8;">Боргирии низоми ҳушманд...</p>
      </div>
      <style>
        @keyframes shahriSpin { to { transform: rotate(360deg); } }
      </style>
    </div>

    <script type="text/javascript">
      // Pre-hydration watchdog: Detects if raw source was served or if loading timed out
      (function() {
        var timeoutId = setTimeout(function() {
          var loader = document.getElementById('pre-hydration-loader');
          if (!loader) return; // React has mounted successfully

          var isGitHub = window.location.hostname.endsWith('github.io');
          var isRawSource = Boolean(document.querySelector('script[src*="/src/main.tsx"]'));

          var html = '<div style="max-width: 540px; margin: 0 auto; background: #11221c; border: 1px solid #10b98144; border-radius: 16px; padding: 28px; text-align: left; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">';
          html += '<div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">';
          html += '<div style="width:12px; height:12px; border-radius:50%; background:#10b981;"></div>';
          html += '<h2 style="margin:0; font-size:18px; color:#ffffff; font-weight:700;">Шаҳри Покиза — Омодасозии GitHub Pages</h2>';
          html += '</div>';

          if (isGitHub && isRawSource) {
            html += '<p style="font-size:13px; color:#cbd5e1; line-height:1.6; margin-bottom:16px;">Дар айни ҳол саҳифаи GitHub Pages рамзи хоми лоиҳаро (raw source) кушода истодааст. Барои оғози кори барнома, бояд манбаи нашр дар танзимоти GitHub ба <b>GitHub Actions</b> гузаронида шавад:</p>';
            html += '<div style="background:#0a1310; border:1px solid #1e3a30; border-radius:10px; padding:14px; font-size:12px; color:#94a3b8; line-height:1.7; margin-bottom:18px;">';
            html += '<b style="color:#10b981;">Дастури 1-дақиқагӣ:</b><br/>';
            html += '1. Ба <a href="https://github.com/alessterx-art/Shahri-pokiza/settings/pages" target="_blank" style="color:#34d399; text-decoration:underline; font-weight:600;">GitHub Repository ➔ Settings ➔ Pages</a> равед.<br/>';
            html += '2. Дар қисми <b>Build and deployment ➔ Source</b> ба ҷои <i>«Deploy from a branch»</i> интихоб намоед: <b style="color:#ffffff;">«GitHub Actions»</b>.<br/>';
            html += '3. Пас аз 1-2 дақиқа ин саҳифаро навсозӣ (Refresh) кунед.';
            html += '</div>';
            html += '<div style="display:flex; gap:10px; flex-wrap:wrap;">';
            html += '<a href="https://github.com/alessterx-art/Shahri-pokiza/settings/pages" target="_blank" style="padding:10px 18px; background:#10b981; color:#0c1512; font-weight:700; font-size:12px; border-radius:8px; text-decoration:none; display:inline-block;">Кушодани Танзимоти GitHub</a>';
            html += '<button onclick="window.location.reload()" style="padding:10px 18px; background:#1e3a30; color:#ffffff; font-weight:600; font-size:12px; border-radius:8px; border:none; cursor:pointer;">Аз нав санҷидан (Reload)</button>';
            html += '</div>';
          } else {
            html += '<p style="font-size:13px; color:#cbd5e1; line-height:1.6; margin-bottom:16px;">Боргирии низом вақти зиёдро талаб карда истодааст. Лутфан тугмаи зерро пахш намуда, кэши браузерро тоза кунед ё саҳифаро аз нав кушоед.</p>';
            html += '<button onclick="window.location.reload()" style="padding:10px 18px; background:#10b981; color:#0c1512; font-weight:700; font-size:12px; border-radius:8px; border:none; cursor:pointer;">Аз нав боргирӣ кардан</button>';
          }

          html += '</div>';
          loader.innerHTML = html;
        }, 3500);

        window.addEventListener('error', function(err) {
          var loader = document.getElementById('pre-hydration-loader');
          if (loader) {
            console.warn('Startup diagnostic caught error:', err);
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
