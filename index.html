<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Шаҳри Покиза — Низоми идоракунии партовҳои шаҳрӣ</title>
    <meta name="description" content="Низоми ҳушманди назорати тозагӣ ва партовҳо дар Тоҷикистон бо ёрии зеҳни сунъӣ ва камераҳои назоратӣ" />
    <meta property="og:title" content="Шаҳри Покиза — Низоми идоракунии партовҳои шаҳрӣ" />
    <meta property="og:description" content="Низоми ҳушманди назорати тозагӣ ва партовҳо дар Тоҷикистон бо ёрии зеҳни сунъӣ ва камераҳои назоратӣ" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0c1512] text-slate-100 antialiased" style="background-color: #0c1512; color: #f1f5f9; margin: 0; min-height: 100vh;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0c1512; color: #10b981; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 48px; height: 48px; border: 3px solid #1e3a30; border-top-color: #10b981; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; font-size: 15px; font-weight: 700; color: #f1f5f9; letter-spacing: 0.3px;">Шаҳри Покиза</p>
        <p style="margin-top: 6px; font-size: 12px; color: #64748b;">Боргирии низоми ҳушманд...</p>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="text/javascript">
      // GitHub Pages SPA router decoder
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
